name: android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build & unit tests
        working-directory: android
        run: |
          # gradlew / gradlew.bat / gradle-wrapper.jar 已随仓库提交（本机 Gradle 8.10.2 生成）
          ./gradlew testDebugUnitTest assembleDebug
      # TODO(W4): 生成 ActionType 枚举的任务接入后，在这里校验生成物与 actions.yaml 一致
