name: server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check app tests ../scripts/deploy_smoke.py ../eval/run_parse.py
      - name: Test
        env:
          MOCK: "1"
        run: pytest
      - name: Build server image
        working-directory: .
        run: docker build -f server/Dockerfile -t suibian-smoke .
      - name: Start isolated smoke server
        run: >-
          docker run -d --name suibian-smoke
          -e MOCK=1 -e AUTH_REQUIRED=0
          -p 127.0.0.1:18000:8000 suibian-smoke
      - name: Wait for startup
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify packaged schema and real simulation
        working-directory: .
        run: python scripts/deploy_smoke.py http://127.0.0.1:18000 --allow-mock
      - name: Container diagnostics
        if: failure()
        run: docker logs suibian-smoke
      - name: Remove smoke container
        if: always()
        run: docker rm -f suibian-smoke || true
